<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>Dungeon Master · Inspeção dos sprites</title><style>body{margin:30px;background:#e8e5db;color:#273743;font:16px system-ui}h1{font-size:24px}p{max-width:1000px;line-height:1.6}canvas{max-width:100%;height:auto;background:#d3d9cf;border:1px solid #8b9b90;image-rendering:pixelated}button{padding:10px;margin:10px}a{color:#235075}</style><h1>Iteração 02.1 · oito poses completas</h1><p>Mesmas poses do atlas usado no jogo. Primeira linha: Idle. Segunda linha: Walk animado. Mochila atrás do tronco, cajado sempre na mão direita, pés e braços acompanhando a direção do corpo.</p><canvas id="sheet" width="1152" height="500" aria-label="Oito direções completas do personagem, em Idle e Walk"></canvas><p id="state"></p><button id="toggle">Pausar animação</button><a href="/">Voltar ao Hub</a><script type="module">
import { drawPlaceholderPose } from './src/adapters/rendering/placeholder-poses.js';
import { SPRITE_DIRECTIONS, animationFrame } from './src/core/actor-animation.js';
const canvas=document.getElementById('sheet'),c=canvas.getContext('2d');let paused=false,time=0,last=performance.now();
document.getElementById('toggle').onclick=()=>{paused=!paused;document.getElementById('toggle').textContent=paused?'Retomar animação':'Pausar animação';};
function render(now){if(!paused)time+=Math.min((now-last)/1000,.1);last=now;c.clearRect(0,0,1152,500);c.imageSmoothingEnabled=false;
for(let row=0;row<2;row++)for(let dir=0;dir<8;dir++){c.fillStyle='#273743';c.font='bold 16px system-ui';c.fillText(SPRITE_DIRECTIONS[dir]+' · '+(row?'Walk':'Idle'),dir*144+22,row*250+28);c.save();c.translate(dir*144+8,row*250+40);c.scale(2,2);drawPlaceholderPose(c,dir,animationFrame(row?'walk':'idle',time));c.restore();}
document.getElementById('state').textContent='Idle: quadro '+animationFrame('idle',time)+' · Walk: quadro '+animationFrame('walk',time);requestAnimationFrame(render);}requestAnimationFrame(render);
</script></html>
