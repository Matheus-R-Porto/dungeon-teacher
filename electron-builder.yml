appId: com.dungeonmaster.playtest
productName: Dungeon Master
buildVersion: 0.6.4.0
asar: true
directories:
  output: release/beta-0.6.4
files:
  - dist/**/*
  - desktop/*.cjs
  - config/multiplayer.json
  - package.json
  - '!node_modules/**/*'
extraResources:
  - from: desktop/LEIA-ME.txt
    to: LEIA-ME.txt
  - from: desktop/CHECKLIST-SHARED-WORLD.txt
    to: CHECKLIST-SHARED-WORLD.txt
win:
  executableName: DungeonMaster
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
nsis:
  artifactName: DungeonMaster-Beta-${version}-SharedWorld-Setup.${ext}
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  createDesktopShortcut: true
  shortcutName: Dungeon Master
portable:
  artifactName: DungeonMaster-Beta-${version}-SharedWorld-Portable.${ext}
publish: null

electronDist: node_modules/electron/dist
